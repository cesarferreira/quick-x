<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1f2b"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf3ff"/>
      <stop offset="1" stop-color="#3b6cff"/>
    </linearGradient>
    <linearGradient id="streak" gradientUnits="userSpaceOnUse" x1="410" y1="0" x2="170" y2="0">
      <stop offset="0" stop-color="#5fb4ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5fb4ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824px squircle centred on a 1024 canvas -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  </g>

  <!-- speed streaks trailing the X -->
  <g stroke="url(#streak)" stroke-linecap="round">
    <line x1="210" y1="420" x2="400" y2="420" stroke-width="22"/>
    <line x1="170" y1="512" x2="380" y2="512" stroke-width="22"/>
    <line x1="230" y1="604" x2="400" y2="604" stroke-width="22"/>
  </g>

  <!-- the X: a white bar and a glowing, faster blue bar -->
  <g stroke-linecap="round" transform="translate(48 0)">
    <line x1="390" y1="300" x2="690" y2="724" stroke="#f4f6fb" stroke-width="92"/>
    <line x1="690" y1="300" x2="390" y2="724" stroke="url(#bolt)" stroke-width="92" filter="url(#glow)"/>
  </g>
</svg>
